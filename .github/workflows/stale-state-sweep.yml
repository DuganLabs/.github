# MANUAL-ONLY. Every workflow in this org runs on workflow_dispatch and
# nothing else: no push, no pull_request, no schedule. The owner runs it
# from the Actions tab when he wants GitHub minutes spent; everything it
# does also runs on a developer machine via scripts/pipeline.sh (checks)
# and the deploy scripts, from the same Doppler config. (2026-09-14)
name: stale-state-sweep

# Weekly: nudge stale issues/PRs so the board reflects reality.
# Aggressive enough to keep the queue honest, gentle enough not to lose context.

on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-message: |
            This issue has been quiet for 60 days. If it still matches reality, drop a comment to keep it open. Otherwise it auto-closes in 14 days.
          stale-pr-message: |
            This PR has been quiet for 30 days. Push or comment to keep it open. Closes in 7 days otherwise.
          close-issue-message: "Auto-closed due to inactivity. Reopen if still relevant."
          close-pr-message: "Auto-closed due to inactivity."
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,roadmap,security"
          exempt-pr-labels: "pinned,wip"
