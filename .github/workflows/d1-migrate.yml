name: d1-migrate (reusable)

# Reusable workflow: apply Cloudflare D1 migrations idempotently.
# Uses `wrangler d1 migrations apply` which tracks applied files in the
# d1_migrations table — re-running is safe.
#
# Cloudflare credentials come from Doppler (preferred, via DOPPLER_TOKEN) or
# direct CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets (fallback) — see
# cf-deploy.yml's header and dotgithub's DOPPLER.md for the full convention.

on:
  workflow_call:
    inputs:
      database:
        type: string
        required: true
      migrations-dir:
        type: string
        default: "migrations"     # default per wrangler convention
      node-version:
        type: string
        default: "20"
      package-manager:
        type: string
        default: "pnpm"
    secrets:
      DOPPLER_TOKEN:
        required: false
        description: |
          Preferred. A read-only Doppler service token scoped to this
          project's config. When set, CLOUDFLARE_API_TOKEN and
          CLOUDFLARE_ACCOUNT_ID come from that Doppler config via
          `doppler run --` and the two secrets below are ignored even if
          also provided.
      CLOUDFLARE_API_TOKEN:
        required: false
        description: Fallback, used only when DOPPLER_TOKEN is not set.
      CLOUDFLARE_ACCOUNT_ID:
        required: false
        description: Fallback, used only when DOPPLER_TOKEN is not set.
      NPM_TOKEN:
        required: false
        description: |
          Optional. PAT or fine-grained token with `read:packages` scope, used
          to install scoped packages from GitHub Packages (e.g. `@basenative/*`).
          When provided, an auth line is appended to ~/.npmrc before install.

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Exported for the whole job so a consumer's project .npmrc line
      # `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}` resolves during
      # install/build/deploy (a project .npmrc shadows the user-level one written
      # below; with the variable unset npm sends an empty token and gets a 401).
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Auth to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          fi

      - name: Install dependencies
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
            bun)  curl -fsSL https://bun.sh/install | bash && ~/.bun/bin/bun install --frozen-lockfile ;;
          esac

      - name: Apply D1 migrations (idempotent)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -d "${{ inputs.migrations-dir }}" ]; then
            echo "No migrations dir at ${{ inputs.migrations-dir }} — skipping."
            exit 0
          fi
          # `wrangler d1 migrations apply` discovers files in the configured
          # migrations dir (default ./migrations). It tracks applied files in
          # the d1_migrations table, so re-runs are no-ops.
          if [ -n "${DOPPLER_TOKEN}" ]; then
            doppler run -- npx wrangler d1 migrations apply ${{ inputs.database }} --remote
          else
            npx wrangler d1 migrations apply ${{ inputs.database }} --remote
          fi
