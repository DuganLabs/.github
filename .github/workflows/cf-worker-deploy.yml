name: cf-worker-deploy (reusable)

# Reusable workflow: deploy a single Cloudflare Worker (not Pages — see
# cf-deploy.yml for that). For a project whose deploy is "install, optionally
# build, then run one wrangler command in one directory" — DuganLabs' and
# warrendugan's worker deploys are exactly this shape.
#
# A deploy with more moving parts than that (multiple Workers, DNS wiring,
# hand-rolled D1 migrations, extra Worker secrets to push) is not a good fit
# — keep it as a bespoke per-repo job rather than contorting it to fit here.
# GreenPut and PendingBusiness are both in that category today.
#
# Same Doppler-or-direct credential convention as cf-deploy.yml and
# d1-migrate.yml: pass secrets.DOPPLER_TOKEN (preferred) or
# secrets.CLOUDFLARE_API_TOKEN + secrets.CLOUDFLARE_ACCOUNT_ID (fallback).
# See dotgithub's DOPPLER.md for the naming convention.

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "worker"
      deploy-command:
        type: string
        required: true
        description: |
          Full command to run, e.g. "pnpm exec wrangler deploy" or
          "npx wrangler deploy". Run from working-directory, with Cloudflare
          credentials in its environment (see the secrets block below).
      build-command:
        type: string
        default: ""
        description: |
          Optional. Run once, from the repo root, before install-time
          checks and the deploy command — e.g. building a frontend the
          Worker serves as assets. Skipped when empty.
      node-version:
        type: string
        default: "20"
      package-manager:
        type: string
        default: "pnpm"        # pnpm | npm | bun
      environment:
        type: string
        default: "production"
      environment-url:
        type: string
        default: ""
    secrets:
      DOPPLER_TOKEN:
        required: false
        description: |
          Preferred. A read-only Doppler service token scoped to this
          project's config. When set, CLOUDFLARE_API_TOKEN and
          CLOUDFLARE_ACCOUNT_ID come from that Doppler config via
          `doppler run --` and the two secrets below are ignored even if
          also provided.
      CLOUDFLARE_API_TOKEN:
        required: false
        description: Fallback, used only when DOPPLER_TOKEN is not set.
      CLOUDFLARE_ACCOUNT_ID:
        required: false
        description: Fallback, used only when DOPPLER_TOKEN is not set.
      NX_CLOUD_ACCESS_TOKEN:
        required: false
        description: Optional. Enables Nx Cloud remote caching during the build, when the project uses Nx.
      NPM_TOKEN:
        required: false
        description: |
          Optional. PAT or fine-grained token with `read:packages` scope, used
          to install scoped packages from GitHub Packages (e.g. `@basenative/*`).
          When provided, an auth line is appended to ~/.npmrc before install.

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment-url }}
    permissions:
      contents: read
      deployments: write
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Auth to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          fi

      - name: Install dependencies
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
            bun)  curl -fsSL https://bun.sh/install | bash && ~/.bun/bin/bun install --frozen-lockfile ;;
          esac

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Deploy Worker
        working-directory: ${{ inputs.working-directory }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${DOPPLER_TOKEN}" ]; then
            doppler run -- bash -c "${{ inputs.deploy-command }}"
          else
            bash -c "${{ inputs.deploy-command }}"
          fi
